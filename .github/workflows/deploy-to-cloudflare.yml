name: Deploy to Cloudflare

on:
    workflow_call:
        inputs:
            environment:
                description: GitHub environment and wrangler `--env` to deploy to (staging | production)
                required: true
                type: string

jobs:
    deploy:
        name: Build and deploy (${{ inputs.environment }})
        runs-on: ubuntu-latest
        environment: ${{ inputs.environment }}
        timeout-minutes: 20
        concurrency:
            group: deploy-${{ inputs.environment }}
            cancel-in-progress: false
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up pnpm
              uses: pnpm/action-setup@v4
              # Version is read from "packageManager" in package.json.

            - name: Set up Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Generate Cloudflare binding types
              run: pnpm run cf-typegen

            - name: Build
              run: pnpm exec opennextjs-cloudflare build

            # D1 migrations are intentionally NOT applied here; apply them
            # manually (`wrangler d1 migrations apply DB --env <env> --remote`)
            # when the schema changes.
            - name: Deploy
              run: pnpm exec opennextjs-cloudflare deploy --env ${{ inputs.environment }}
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
